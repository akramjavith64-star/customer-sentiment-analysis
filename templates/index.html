<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Feedback Sentiment Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
    <div class="container">
        <h1>Customer Feedback Sentiment Analysis</h1>

        <form method="POST" action="/predict">
            <textarea name="feedback" placeholder="Enter your feedback here..." required></textarea>
            <br>
            <button type="submit">Analyze</button>
        </form>

        {% if prediction %}
        <div class="result">
            <h2>Feedback:</h2>
            <p>{{ feedback }}</p>
            <h2>Predicted Sentiment:</h2>
            <p><strong>{{ prediction }}</strong></p>
        </div>
        {% endif %}
    </div>
</body>
</html>
